<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="NihonGo! - Aplikasi pembelajaran bahasa Jepang interaktif dengan kosakata, kana, kanji, dan quiz harian.">
<meta name="keywords" content="belajar jepang, nihongo, hiragana, katakana, kanji, kosakata">
<meta name="author" content="NihonGo Team">
<meta name="theme-color" content="#E24B4A">
<meta property="og:title" content="NihonGo! — Minna no Nihongo">
<meta property="og:description" content="Aplikasi pembelajaran bahasa Jepang interaktif dengan kosakata, kana, kanji, dan quiz harian.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="NihonGo! — Minna no Nihongo">
<meta name="twitter:description" content="Aplikasi pembelajaran bahasa Jepang interaktif">
<title>NihonGo! — Minna no Nihongo</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23E24B4A' width='100' height='100'/><text x='50' y='65' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>日</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{-webkit-tap-highlight-color:transparent}
:root{
  --red:#E24B4A;--red-l:rgba(226,75,74,0.15);
  --green:#4CD964;--green-l:rgba(76,217,100,0.12);
  --blue:#4A9EE2;--blue-l:rgba(74,158,226,0.15);
  --amber:#F0A500;--amber-l:rgba(240,165,0,0.15);
  --purple:#8B7FE8;--purple-l:rgba(139,127,232,0.15);
  --text:#FFFFFF;--muted:rgba(255,255,255,0.5);--muted2:rgba(255,255,255,0.25);
  --bg:#0d0d0d;--card:#1a1a1a;--border:rgba(255,255,255,0.08);
  --r:14px;--rl:18px;
}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;background:var(--bg);min-height:100vh;color:var(--text);user-select:none}
button,a,[onclick]{outline:none;-webkit-tap-highlight-color:transparent;-webkit-focus-ring-color:transparent}
button:focus,a:focus,[onclick]:focus{outline:none;box-shadow:none}
button{outline:none;border:none;-webkit-tap-highlight-color:transparent}
*:focus{outline:none}
*:focus-visible{outline:none}
div[onclick]{-webkit-user-select:none;outline:none}

/* ── GLOBAL BUTTON / TAP ANIMATION ── */
button,[onclick]{transition:transform .15s cubic-bezier(.4,0,.2,1),opacity .15s ease,box-shadow .15s ease,filter .15s ease;will-change:transform}
button:active,[onclick]:active{transform:scale(0.94)}
@media (hover:hover) and (pointer:fine){
  button:hover,[onclick]:hover{filter:brightness(1.08)}
}

.screen{display:none;min-height:100vh}
.screen.active{display:block}

/* ── HOME HERO ── */
.home-hero{
  position:relative;overflow:hidden;
  height:clamp(160px,32vh,230px);display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;
}
.hero-bg{
  position:absolute;inset:0;
  background-image:url('https://images.unsplash.com/photo-1745508823954-f478efc8b731?w=900&q=85&auto=format&fit=crop');
  background-size:cover;background-position:center 40%;
  filter:brightness(0.55);
}
.hero-overlay{
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(13,13,13,0) 0%,rgba(13,13,13,1) 100%);
}
.hero-content{position:relative;z-index:2;color:#fff}
.hero-content h1{font-size:clamp(28px,7vw,42px);font-weight:900;letter-spacing:-0.5px;text-shadow:0 2px 10px rgba(0,0,0,0.6)}

/* WOTD */
.wotd-wrap{padding:0 clamp(12px,4vw,20px);margin-top:clamp(-40px,-6vh,-24px);position:relative;z-index:3}
.wotd-flip{perspective:1200px;cursor:pointer;height:clamp(115px,25vh,138px);touch-action:manipulation;user-select:none}
.wotd-flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,0,.2,1);transform-style:preserve-3d}
.wotd-flip.flipped .wotd-flip-inner{transform:rotateY(180deg)}
.wotd-face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--rl);border:1px solid var(--border);
  padding:clamp(16px,4vw,20px) clamp(16px,5vw,24px);
  display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
  overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,.5);
}
.wotd-face-front{background:var(--card)}
.wotd-face-front::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--red),var(--amber))}
.wotd-face-back{background:linear-gradient(135deg,#0A2218,#071510);transform:rotateY(180deg);border-color:rgba(76,217,100,0.2)}
.wotd-label{
  font-size:clamp(9px,2.5vw,11px);font-weight:900;color:var(--muted);
  text-transform:uppercase;letter-spacing:.1em;margin-bottom:clamp(10px,2.5vh,16px);
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;width:100%;
}
.wotd-tap-hint{font-size:clamp(8px,2vw,10px);font-weight:800;color:var(--muted2);text-transform:none;letter-spacing:0;display:flex;align-items:center;gap:4px}
.wotd-jp{font-family:'Noto Sans JP',sans-serif;font-size:clamp(26px,7vw,42px);font-weight:700;color:#fff;line-height:1.2;word-break:break-word;overflow-wrap:break-word;hyphens:auto;white-space:pre-line}
.wotd-rom{font-size:clamp(11px,2.2vw,13px);color:var(--muted);font-weight:800;margin-top:clamp(4px,1vh,6px);word-break:break-word;overflow-wrap:break-word}
.wotd-meaning-label{font-size:clamp(8px,2vw,10px);font-weight:900;color:rgba(76,217,100,0.55);text-transform:uppercase;letter-spacing:.07em;margin-bottom:clamp(4px,1vh,6px)}
.wotd-meaning{font-size:clamp(22px,5.5vw,34px);font-weight:900;color:var(--green);line-height:1.3;word-break:break-word;overflow-wrap:break-word;hyphens:auto}
.wotd-tag{display:inline-block;font-size:clamp(9px,1.8vw,11px);font-weight:900;color:var(--blue);background:var(--blue-l);padding:clamp(2px,0.5vh,4px) clamp(8px,1.5vw,10px);border-radius:99px;margin-top:clamp(8px,1.5vh,12px);border:1px solid rgba(74,158,226,0.2)}
.wotd-refresh{
  margin-top:clamp(12px,2vh,16px);width:100%;padding:clamp(8px,1.5vh,12px) clamp(12px,3vw,16px);border-radius:10px;
  border:1px solid var(--border);background:rgba(255,255,255,0.04);
  color:var(--muted);font-family:'Nunito',sans-serif;font-size:clamp(11px,2vw,13px);font-weight:800;cursor:pointer;
  transition:all .15s;touch-action:manipulation;user-select:none;
}
.wotd-refresh:hover{border-color:rgba(226,75,74,0.4);color:var(--red)}
.wotd-refresh:active{transform:scale(0.98)}

/* SPEAK BUTTON */
.speak-btn{
  display:inline-flex;align-items:center;justify-content:center;
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  border:1px solid var(--border);background:rgba(255,255,255,0.06);
  color:var(--text);font-size:15px;cursor:pointer;transition:all .15s;
  touch-action:manipulation;padding:0;user-select:none;
}
.speak-btn:hover{border-color:rgba(74,158,226,0.5);background:rgba(74,158,226,0.12)}
.speak-btn:active{transform:scale(0.92)}
.speak-btn.speaking{border-color:var(--blue);background:rgba(74,158,226,0.2);animation:speakPulse .6s ease-in-out infinite}
.speak-btn.speak-unsupported{opacity:0.35;cursor:not-allowed}
.jp-speakable{cursor:pointer}
.jp-speakable:active{opacity:0.55}
@keyframes speakPulse{0%,100%{box-shadow:0 0 0 0 rgba(74,158,226,0.4)}50%{box-shadow:0 0 0 6px rgba(74,158,226,0)}}
.kana-card .speak-icon{position:absolute;top:4px;right:4px;font-size:9px;opacity:0.35}

/* WOTD Responsive untuk tablet dan desktop */
@media (max-width:480px){
  .wotd-jp{font-size:clamp(22px,6vw,28px)}
  .wotd-meaning{font-size:clamp(18px,4.5vw,24px)}
  .wq-meaning-text{font-size:24px}
  .wq-input{font-size:18px;padding:14px}
}

@media (min-width:768px){
  .wotd-wrap{padding:0 clamp(20px,5vw,40px);margin-top:clamp(-30px,-6vh,-50px)}
  .wotd-face{padding:clamp(20px,3vw,28px) clamp(20px,4vw,32px)}
}

/* MENU */
.home-body{padding:22px 16px 48px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.section-head h2{font-size:12px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.add-btn{
  display:flex;align-items:center;gap:5px;
  background:var(--red-l);color:var(--red);
  font-family:'Nunito',sans-serif;font-size:12px;font-weight:900;padding:7px 16px;
  border-radius:99px;border:1px solid rgba(226,75,74,0.3);
  cursor:pointer;transition:all .15s;white-space:nowrap;user-select:none;
}
.add-btn:hover{background:var(--red);color:#fff}

.kq-start-btn{
  display:flex;align-items:center;justify-content:center;gap:6px;
  width:100%;background:var(--red);color:#fff;
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;
  padding:9px 16px;border-radius:10px;border:none;
  cursor:pointer;transition:all .15s;margin-bottom:18px;user-select:none;
}
.kq-start-btn:hover{opacity:.88}
.kq-start-btn:active{transform:scale(0.98)}

.menu-grid{display:flex;flex-direction:column;gap:12px}
.menu-grid-kana{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:0}
.menu-card{
  display:flex;align-items:center;gap:16px;
  border-radius:var(--rl);padding:18px;cursor:pointer;
  transition:all .18s;position:relative;overflow:hidden;border:1px solid var(--border);user-select:none;
}
.menu-card:hover{transform:translateY(-2px);filter:brightness(1.1)}
.menu-card:active{transform:scale(0.98)}
.menu-card.mc-blue{background:linear-gradient(135deg,#0D2137,#0A1929);border-color:rgba(74,158,226,0.2);box-shadow:0 4px 20px rgba(74,158,226,0.1)}
.menu-card.mc-red{background:linear-gradient(135deg,#2A0A0A,#1C0606);border-color:rgba(226,75,74,0.2);box-shadow:0 4px 20px rgba(226,75,74,0.1)}
.menu-card.mc-purple{background:linear-gradient(135deg,#150D2E,#0E0820);border-color:rgba(139,127,232,0.2);box-shadow:0 4px 20px rgba(139,127,232,0.1)}
.menu-card.mc-green{background:linear-gradient(135deg,#0A2218,#071510);border-color:rgba(76,217,100,0.2);box-shadow:0 4px 20px rgba(76,217,100,0.1)}
.menu-card.mc-amber{background:linear-gradient(135deg,#241800,#180F00);border-color:rgba(240,165,0,0.2);box-shadow:0 4px 20px rgba(240,165,0,0.1)}
.menu-icon{width:54px;height:54px;border-radius:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-family:'Noto Sans JP',sans-serif;font-weight:700}
.menu-icon.gr-blue{background:rgba(74,158,226,0.15);border:1px solid rgba(74,158,226,0.25)}
.menu-icon.gr-red{background:rgba(226,75,74,0.15);border:1px solid rgba(226,75,74,0.25)}
.menu-icon.gr-purple{background:rgba(139,127,232,0.15);border:1px solid rgba(139,127,232,0.25)}
.menu-icon.gr-green{background:rgba(76,217,100,0.15);border:1px solid rgba(76,217,100,0.25)}
.menu-icon.gr-amber{background:rgba(240,165,0,0.15);border:1px solid rgba(240,165,0,0.25)}
.menu-info{flex:1;min-width:0}
.menu-title{font-size:17px;font-weight:900;color:#fff;margin-bottom:3px}
.menu-desc{font-size:12px;color:var(--muted);font-weight:700;line-height:1.4}
.menu-arrow{font-size:20px;color:var(--muted2);flex-shrink:0}
.menu-card-sm{flex-direction:column;align-items:center;text-align:center;padding:8px 8px}
.menu-card-sm .menu-icon{width:auto;height:auto;font-size:22px;margin-bottom:4px;background:none;border:none}
.menu-card-sm .menu-info{min-width:0;width:100%}
.menu-card-sm .menu-arrow{display:none}
.menu-card-sm .menu-title{font-size:12.5px}

.ic-red{background:var(--red-l)}.ic-blue{background:var(--blue-l)}.ic-green{background:var(--green-l)}.ic-amber{background:var(--amber-l)}.ic-purple{background:var(--purple-l)}




/* ── TOPBARS & NAV ── */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back-btn{
  width:38px;height:38px;border-radius:10px;
  border:1px solid var(--border);background:rgba(255,255,255,0.06);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:18px;color:#fff;transition:all .15s;flex-shrink:0;user-select:none;
}
.back-btn:hover{border-color:var(--red);color:var(--red)}
.topbar h2{font-size:18px;font-weight:900;color:#fff;flex:1;user-select:none}
.prog-wrap{flex:1}
.prog-track{height:8px;background:rgba(255,255,255,0.1);border-radius:99px;overflow:hidden}
.prog-bar{height:100%;background:var(--red);border-radius:99px;transition:width .4s cubic-bezier(.4,0,.2,1);width:0%}
.q-counter{font-size:12px;font-weight:900;color:var(--muted);white-space:nowrap;user-select:none}

/* ── VOCABULARY LIST SCREEN (Grid Layout like Kanji) ── */
.vocab-list-wrap{padding:0 16px}
.vocab-list-title{font-size:11px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.vocab-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vocab-item{border-radius:16px;padding:16px 12px;text-align:center;position:relative;overflow:hidden;border:none;cursor:pointer;transition:transform .15s;user-select:none}
.vocab-item:active{transform:scale(0.97)}
.vocab-item:nth-child(5n+1){background:linear-gradient(145deg,#1C2833,#212F3C);border:1px solid #2E4057}
.vocab-item:nth-child(5n+2){background:linear-gradient(145deg,#1B2631,#17202A);border:1px solid #1F3A5F}
.vocab-item:nth-child(5n+3){background:linear-gradient(145deg,#1A1A2E,#16213E);border:1px solid #2C3E6B}
.vocab-item:nth-child(5n+4){background:linear-gradient(145deg,#1C0E0E,#2C1810);border:1px solid #5C2222}
.vocab-item:nth-child(5n+5){background:linear-gradient(145deg,#0E1A1C,#0B1A1C);border:1px solid #1A4A52}
.vocab-item:nth-child(5n+1) .vocab-item-kana{color:#6FB7F0}
.vocab-item:nth-child(5n+2) .vocab-item-kana{color:#4FD1E8}
.vocab-item:nth-child(5n+3) .vocab-item-kana{color:#B49AFF}
.vocab-item:nth-child(5n+4) .vocab-item-kana{color:#FFAA5C}
.vocab-item:nth-child(5n+5) .vocab-item-kana{color:#5EEAD4}
.vocab-item-jp{font-family:'Noto Sans JP',sans-serif;font-size:42px;font-weight:700;color:#fff;line-height:1.3;margin-bottom:8px;text-shadow:0 2px 12px rgba(255,255,255,0.1);word-break:keep-all;overflow-wrap:break-word;white-space:pre-line}
.vocab-item-jp.vocab-len-2{font-size:38px}
.vocab-item-jp.vocab-len-3{font-size:32px}
.vocab-item-jp.vocab-len-4{font-size:26px}
.vocab-item-jp.vocab-len-5{font-size:22px}
.vocab-item-kana{font-family:'Noto Sans JP',sans-serif;font-size:12px;color:rgba(255,255,255,0.5);margin-bottom:1px;white-space:pre-line}
.vocab-item-rom{font-size:10px;color:rgba(255,255,255,0.35);font-weight:700;margin-bottom:8px;white-space:pre-line}
.vocab-item-divider{height:1px;background:rgba(255,255,255,0.08);margin:0 0 8px}
.vocab-item-meaning{font-size:13px;font-weight:900;color:rgba(255,255,255,0.9)}

/* ── SESSION LIST CARDS ── */
/* ── QUIZ TABS (Bab / Tambahan) ── */
.quiz-tabs{
  display:flex;gap:8px;margin-bottom:18px;
  background:rgba(255,255,255,0.04);border:1px solid var(--border);
  border-radius:12px;padding:4px;
}
.quiz-tab{
  flex:1;padding:10px 12px;border-radius:9px;border:none;
  background:transparent;color:var(--muted);
  font-family:'Nunito',sans-serif;font-size:13px;font-weight:900;
  cursor:pointer;transition:all .18s;user-select:none;
}
.quiz-tab:hover{color:#fff}
.quiz-tab.active{background:var(--red);color:#fff;box-shadow:0 2px 10px rgba(226,75,74,0.35)}

.session-list{display:flex;flex-direction:column;gap:12px}
.session-card{
  background:var(--card);border-radius:var(--rl);border:1px solid var(--border);
  padding:18px;transition:all .15s;user-select:none;
}
.session-card:hover{border-color:rgba(226,75,74,0.4);transform:translateY(-2px);box-shadow:0 4px 20px rgba(226,75,74,0.1)}
.sc-top{display:flex;align-items:center;gap:14px}
.sc-icon{width:48px;height:48px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:22px;background:rgba(255,255,255,0.06);border:1px solid var(--border)}
.sc-info{flex:1;min-width:0}
.sc-title{font-size:15px;font-weight:900;color:#fff;margin-bottom:3px}
.sc-meta{font-size:12px;color:var(--muted);font-weight:700}
.sc-badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end;flex-shrink:0}
.sc-badge{font-size:10px;font-weight:900;padding:3px 10px;border-radius:99px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.badge-new{background:var(--amber-l);color:var(--amber);border:1px solid rgba(240,165,0,0.2)}
.badge-done{background:var(--green-l);color:var(--green);border:1px solid rgba(76,217,100,0.2)}
.badge-custom{background:var(--purple-l);color:var(--purple);border:1px solid rgba(139,127,232,0.2)}
.sc-progress{margin-top:12px}
.sc-prog-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px}
.sc-prog-label{font-size:11px;color:var(--muted);font-weight:700}
.sc-prog-val{font-size:11px;font-weight:900;color:var(--green)}
.sc-prog-track{height:6px;background:rgba(255,255,255,0.08);border-radius:99px;overflow:hidden}
.sc-prog-fill{height:100%;background:var(--green);border-radius:99px;transition:width .4s ease}
.sc-actions{display:flex;gap:8px;margin-top:12px}
.sc-play-btn{flex:1;padding:11px;border-radius:10px;background:var(--red);color:#fff;border:none;font-family:'Nunito',sans-serif;font-size:14px;font-weight:900;cursor:pointer;transition:opacity .15s;user-select:none}
.sc-play-btn:hover{opacity:.85}
.sc-edit-btn{padding:11px 16px;border-radius:10px;background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid var(--border);font-family:'Nunito',sans-serif;font-size:13px;font-weight:800;cursor:pointer;transition:all .15s}
.sc-edit-btn:hover{border-color:var(--blue);color:var(--blue)}
.sc-del-btn{padding:11px 14px;border-radius:10px;background:rgba(255,255,255,0.05);color:var(--muted);border:1px solid var(--border);font-family:'Nunito',sans-serif;font-size:13px;cursor:pointer;transition:all .15s}
.sc-del-btn:hover{border-color:var(--red);color:var(--red);background:var(--red-l)}
.empty-state{text-align:center;padding:40px 20px;color:var(--muted)}
.empty-state .es-icon{font-size:44px;margin-bottom:12px}
.empty-state p{font-size:14px;font-weight:700}

/* ── QUIZ ── */
#quizScreen{background:var(--bg);padding:24px 16px 80px}
.qcontainer{max-width:480px;margin:0 auto}
.flashcard{
  background:var(--card);border-radius:var(--rl);border:1px solid var(--border);
  padding:32px 24px 28px;text-align:center;
  box-shadow:0 4px 24px rgba(0,0,0,.4);margin-bottom:14px;
  min-height:240px;display:flex;flex-direction:column;align-items:center;justify-content:center;user-select:none;
}
.fc-tag{font-size:10px;font-weight:900;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:12px}
.fc-rom{font-size:14px;color:#ffffff;font-weight:700;margin-bottom:4px}
